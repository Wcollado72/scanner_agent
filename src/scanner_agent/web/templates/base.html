<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanner Agent — {% block title %}Dashboard{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f4f6f9; font-size: .9rem; }
    .navbar-brand { font-weight: 700; letter-spacing: .4px; }
    /* Flag badge colors */
    .flag-EXACT_DUPLICATE   { background: #dc3545 !important; color: #fff; }
    .flag-NEAR_DUPLICATE    { background: #ffc107 !important; color: #212529; }
    .flag-POSSIBLE_DECEASED { background: #0dcaf0 !important; color: #212529; }
    .flag-ANOMALY           { background: #6c757d !important; color: #fff; }
    /* Status pill */
    .status-pill-pending   { background: #e9ecef; color: #6c757d; border: 1px solid #dee2e6; }
    .status-pill-confirmed { background: #d1e7dd; color: #0f5132; }
    .status-pill-rejected  { background: #cfe2ff; color: #084298; }
    /* Record card accent */
    .record-card { border-left: 4px solid #dee2e6; }
    .record-card.is-deleted { opacity: .45; filter: grayscale(.6); }
    /* Action panel sticky */
    .action-panel { position: sticky; top: 76px; }
    /* Compact table */
    .findings-table td, .findings-table th { vertical-align: middle; }
    /* History timestamps */
    .history-ts { font-size: .72rem; }
  </style>
</head>
<body>

{% if session.role %}
<nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('dashboard') }}">
      <i class="bi bi-shield-check me-1"></i>Scanner Agent
    </a>
    <div class="d-flex align-items-center gap-3">
      <span class="badge {% if session.role == 'admin' %}bg-danger{% else %}bg-secondary{% endif %} px-3 py-2">
        <i class="bi bi-person-fill me-1"></i>{{ session.role_label }}
      </span>
      <a href="{{ url_for('logout') }}" class="btn btn-sm btn-outline-light">
        <i class="bi bi-box-arrow-right me-1"></i>Salir
      </a>
    </div>
  </div>
</nav>
{% endif %}

<div class="container-fluid px-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show py-2" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
