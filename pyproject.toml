[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scanner-agent"
version = "0.5.0"
description = "Safe-first AI-assisted file intelligence and duplicate detection engine — audit agent for PR government data."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "William Rafael Collado Santiago" }
]
license = { text = "MIT" }
dependencies = [
  "python-dotenv>=1.0.1",
  "psutil>=5.9.8",
  "rich>=13.0.0",
  "flask>=3.0.0",
  "openpyxl>=3.1.0",
  "sqlalchemy>=2.0.0",
]



[project.optional-dependencies]
connectors = [
  "pyodbc>=5.0.0",
  "pymysql>=1.1.0",
  "cryptography>=42.0.0",
]
ai = [
  "google-genai>=1.11.0",
  "google-auth-oauthlib>=1.2.0",
  "google-api-python-client>=2.170.0"
]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.11.0"
]

[project.scripts]
scanner-agent = "scanner_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
